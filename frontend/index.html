    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='9' cy='10' r='4' fill='%236d5efc'/><circle cx='23' cy='10' r='4' fill='%2322b8a6'/><circle cx='16' cy='23' r='4' fill='%23f5a524'/></svg>" />

    <script>
      // apply the saved theme before first paint so there is no light/dark flash
      try { var t = localStorage.getItem('swarm.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t } catch (e) {}
    </script>

    <div id="root"></div>
